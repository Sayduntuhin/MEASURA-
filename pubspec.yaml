name: garment_measurement_app
description: Digital garment measurement QA tally and stats tool.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend / auth
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  google_sign_in: ^6.2.2

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  file_picker: ^8.0.0
  http: ^1.2.0
  syncfusion_flutter_pdf: ^34.2.6
  syncfusion_flutter_xlsio: ^34.2.6
  share_plus: ^10.0.0
  path_provider: ^2.1.6
  archive: ^4.0.0
  xml: any
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

